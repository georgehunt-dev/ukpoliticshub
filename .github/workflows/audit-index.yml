name: Audit index coverage

# Asks Google, for every URL in the sitemap, whether it is actually indexed,
# and commits the answer to data/generated/index-status.json.
#
# This measures; it does not push pages at Google. The Indexing API is
# documented as being for JobPosting and BroadcastEvent only, so the way to
# get 650 seat pages crawled is an honest sitemap and pages that are reachable
# in few clicks, not an API call. What this gives us is the evidence: which
# URLs are unindexed, and which of Google's reasons applies to each.
#
# Weekly rather than nightly on purpose. Coverage state moves over weeks, the
# 2,000/day quota is shared with anything else inspecting the property, and a
# daily 750-URL sweep would spend most of it to redraw the same picture.

on:
  schedule:
    # 04:20 UTC on Mondays, well clear of the nightly recorders.
    - cron: "20 4 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # ~750 URLs at 300/minute is about three minutes, plus room for one
    # quota back-off.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The script uses only node:crypto and fetch, but npm ci keeps this in
      # step with the other recorders and costs seconds against a warm cache.
      - name: Install dependencies
        run: npm ci

      - name: Inspect every URL in the sitemap
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/audit-index.mjs

      - name: Commit if the picture changed
        run: |
          set -euo pipefail

          # No secrets set means the script wrote nothing, which is not a
          # failure: it is the state this repo is in until the service
          # account exists. Committing here would overwrite a real audit.
          if [ ! -f data/generated/index-status.json ]; then
            echo "No audit written: Search Console credentials are not configured."
            exit 0
          fi

          if git diff --quiet -- data/generated/index-status.json; then
            echo "No change since the last audit."
            exit 0
          fi

          git config user.name "ukpoliticshub bot"
          git config user.email "actions@github.com"
          git add data/generated/index-status.json
          git commit -m "index coverage for $(date -u +%Y-%m-%d)"
          git push
