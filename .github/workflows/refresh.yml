name: Refresh live news

# The primary scheduler for the site.
#
# It lives here rather than in vercel.json because Vercel's Hobby plan caps
# cron at once per day and rejects anything more frequent at deploy time.
# GitHub Actions runs free at any interval, so the schedule works on every plan.
#
# GitHub's scheduled runs are best-effort and can be delayed under load, which
# is fine: the site's own 10-minute ISR window is the floor, and this job is
# what keeps the cache warm on top of it.

on:
  schedule:
    # Every 15 minutes.
    - cron: "*/15 * * * *"
  # Lets you trigger a refresh by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the refresh endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ukpoliticshub.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${REVALIDATE_SECRET}" ]; then
            echo "::error::REVALIDATE_SECRET is not set in repository secrets."
            exit 1
          fi

          response=$(mktemp)
          code=$(curl -sS -o "$response" -w "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 10 \
            -X POST "${SITE_URL}/api/revalidate" \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}")

          echo "HTTP ${code}"
          cat "$response"
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Refresh failed with HTTP ${code}"
            exit 1
          fi
